<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>production-api</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%2312151A%22/><circle cx=%2216%22 cy=%2216%22 r=%226%22 fill=%22%234FD1C5%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151A;
    --panel:#1B1F26;
    --panel-2:#20242C;
    --border:#2A2F38;
    --text:#E7E9EC;
    --text-muted:#8A93A3;
    --text-faint:#5B6472;
    --amber:#E8A33D;
    --teal:#4FD1C5;
    --red:#E5787C;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(79,209,197,0.05), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(232,163,61,0.04), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    display:flex;
    flex-direction:column;
  }
  ::selection{background:rgba(79,209,197,0.25);}

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 24px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand .mark{
    width:9px;height:9px;border-radius:2px;
    background:var(--teal);
    box-shadow:0 0 10px rgba(79,209,197,0.6);
    flex-shrink:0;
  }
  .brand .name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.01em;
  }
  .brand .name span{ color:var(--text-faint); font-weight:500; }

  .headerRight{ display:flex; align-items:center; gap:18px; }
  .status{
    display:flex; align-items:center; gap:7px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--text-muted);
    letter-spacing:0.02em;
  }
  .status .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--text-faint);
    transition:background .3s ease, box-shadow .3s ease;
  }
  .status.online .dot{ background:var(--teal); box-shadow:0 0 6px rgba(79,209,197,0.7);}
  .status.offline .dot{ background:var(--red); box-shadow:0 0 6px rgba(229,120,124,0.7);}
  .docsLink{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--text-muted);
    text-decoration:none;
    border:1px solid var(--border);
    padding:5px 10px;
    border-radius:6px;
    transition:border-color .15s ease, color .15s ease;
  }
  .docsLink:hover{ border-color:var(--text-faint); color:var(--text); }
  .docsLink:focus-visible, button:focus-visible, textarea:focus-visible{
    outline:2px solid var(--teal); outline-offset:2px;
  }

  /* ---------- Chat area ---------- */
  main{
    flex:1;
    overflow-y:auto;
    display:flex;
    justify-content:center;
  }
  .thread{
    width:100%;
    max-width:720px;
    padding:32px 20px 24px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .empty{
    margin:auto;
    text-align:center;
    color:var(--text-faint);
    padding:40px 20px;
  }
  .empty .glyph{
    width:34px;height:34px;border-radius:8px;
    background:var(--panel);
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 16px;
    color:var(--teal);
  }
  .empty h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:16px; font-weight:600; color:var(--text-muted);
    margin:0 0 6px;
  }
  .empty p{ font-size:13px; margin:0; line-height:1.6; }

  .row{ display:flex; flex-direction:column; max-width:100%; }
  .row.user{ align-items:flex-end; }
  .row.assistant{ align-items:flex-start; }

  .bubble{
    padding:12px 15px;
    border-radius:var(--radius);
    font-size:14.5px;
    line-height:1.55;
    white-space:pre-wrap;
    word-wrap:break-word;
    max-width:78%;
    animation:rise .25s ease-out;
  }
  @media (prefers-reduced-motion:reduce){ .bubble{ animation:none; } }
  @keyframes rise{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .row.user .bubble{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-bottom-right-radius:3px;
    color:var(--text);
  }
  .row.assistant .bubble{
    background:transparent;
    border:1px solid var(--border);
    border-bottom-left-radius:3px;
  }
  .row.system .bubble{
    background:rgba(229,120,124,0.08);
    border:1px solid rgba(229,120,124,0.3);
    color:#F0AFB2;
    font-size:13px;
    max-width:90%;
  }

  /* trace strip — the signature element: surfaces real telemetry from the API response */
  .trace{
    margin-top:6px;
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--text-faint);
    letter-spacing:0.01em;
    padding-left:2px;
    flex-wrap:wrap;
  }
  .trace .cdot{ width:5px;height:5px;border-radius:50%; flex-shrink:0;}
  .trace .cdot.hit{ background:var(--teal); }
  .trace .cdot.miss{ background:var(--amber); }
  .trace .sep{ color:var(--border); }
  .trace .flag{
    color:var(--amber);
    border:1px solid rgba(232,163,61,0.35);
    border-radius:4px;
    padding:1px 5px;
  }

  .typing{ display:flex; gap:4px; padding:14px 4px; }
  .typing span{
    width:5px;height:5px;border-radius:50%;
    background:var(--text-faint);
    animation:blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay:.15s; }
  .typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes blink{ 0%,80%,100%{opacity:.25;} 40%{opacity:1;} }

  /* ---------- Composer ---------- */
  .composerWrap{
    display:flex; justify-content:center;
    border-top:1px solid var(--border);
    background:linear-gradient(180deg, rgba(18,21,26,0) 0%, var(--bg) 40%);
    flex-shrink:0;
  }
  .composer{
    width:100%; max-width:720px;
    padding:16px 20px 20px;
    display:flex;
    gap:10px;
    align-items:flex-end;
  }
  textarea{
    flex:1;
    resize:none;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:12px 14px;
    border-radius:9px;
    line-height:1.5;
    max-height:160px;
    transition:border-color .15s ease;
  }
  textarea:focus{ border-color:var(--text-faint); }
  textarea::placeholder{ color:var(--text-faint); }

  button.send{
    background:var(--teal);
    color:#0B1414;
    border:none;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding:12px 18px;
    border-radius:9px;
    cursor:pointer;
    transition:filter .15s ease, transform .05s ease;
    flex-shrink:0;
  }
  button.send:hover:not(:disabled){ filter:brightness(1.08); }
  button.send:active:not(:disabled){ transform:scale(0.98); }
  button.send:disabled{ opacity:.4; cursor:not-allowed; }

  .footRow{
    display:flex; justify-content:space-between; align-items:center;
    max-width:720px; margin:0 auto; padding:0 20px 14px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px; color:var(--text-faint);
  }
  .newThread{
    background:none; border:none; color:var(--text-faint);
    font-family:'IBM Plex Mono',monospace; font-size:10.5px;
    cursor:pointer; text-decoration:underline; padding:0;
  }
  .newThread:hover{ color:var(--text-muted); }

  main::-webkit-scrollbar{ width:8px; }
  main::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark"></div>
    <div class="name">production-api<span> · agent console</span></div>
  </div>
  <div class="headerRight">
    <div class="status" id="statusIndicator">
      <div class="dot"></div>
      <span id="statusText">checking</span>
    </div>
    <a class="docsLink" href="/docs" target="_blank" rel="noopener">API reference</a>
  </div>
</header>

<main id="main">
  <div class="thread" id="thread">
    <div class="empty" id="emptyState">
      <div class="glyph">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      </div>
      <h1>Send a message to start</h1>
      <p>Each reply is annotated with the model, latency, and cache<br>state the API actually returned — not decoration.</p>
    </div>
  </div>
</main>

<div class="composerWrap">
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Message the agent…"></textarea>
    <button class="send" id="sendBtn">Send</button>
  </div>
</div>
<div class="footRow">
  <span id="threadLabel">thread · —</span>
  <button class="newThread" id="newThreadBtn">start new conversation</button>
</div>

<script>
const $ = (id) => document.getElementById(id);
const thread = $('thread'), input = $('input'), sendBtn = $('sendBtn'),
      emptyState = $('emptyState'), threadLabel = $('threadLabel'),
      statusIndicator = $('statusIndicator'), statusText = $('statusText'),
      newThreadBtn = $('newThreadBtn'), mainEl = $('main');

function getThreadId(){
  let id = localStorage.getItem('pa_thread_id');
  if(!id){
    id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
    localStorage.setItem('pa_thread_id', id);
  }
  return id;
}
let threadId = getThreadId();
threadLabel.textContent = 'thread · ' + threadId.slice(0,8);

newThreadBtn.addEventListener('click', () => {
  threadId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
  localStorage.setItem('pa_thread_id', threadId);
  threadLabel.textContent = 'thread · ' + threadId.slice(0,8);
  thread.innerHTML = '';
  thread.appendChild(emptyState);
  emptyState.style.display = 'block';
});

async function pingHealth(){
  try{
    const res = await fetch('/health');
    if(res.ok){
      statusIndicator.className = 'status online';
      statusText.textContent = 'online';
    } else {
      statusIndicator.className = 'status offline';
      statusText.textContent = 'degraded';
    }
  } catch(e){
    statusIndicator.className = 'status offline';
    statusText.textContent = 'offline';
  }
}
pingHealth();
setInterval(pingHealth, 30000);

function autoGrow(){
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
}
input.addEventListener('input', autoGrow);
input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    send();
  }
});

function addRow(kind, text){
  emptyState.style.display = 'none';
  const row = document.createElement('div');
  row.className = 'row ' + kind;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);
  thread.appendChild(row);
  mainEl.scrollTop = mainEl.scrollHeight;
  return row;
}

function addTypingRow(){
  const row = document.createElement('div');
  row.className = 'row assistant';
  row.innerHTML = '<div class="bubble typing"><span></span><span></span><span></span></div>';
  thread.appendChild(row);
  mainEl.scrollTop = mainEl.scrollHeight;
  return row;
}

function addTrace(row, data){
  const t = document.createElement('div');
  t.className = 'trace';
  const dotClass = data.cached ? 'hit' : 'miss';
  const cacheLabel = data.cached ? 'cache hit' : 'cache miss';
  let html = `<span class="cdot ${dotClass}"></span><span>${data.model_used}</span>` +
             `<span class="sep">·</span><span>${Math.round(data.processing_time_ms)}ms</span>` +
             `<span class="sep">·</span><span>${cacheLabel}</span>`;
  if(data.security_notes && data.security_notes.length){
    html += `<span class="sep">·</span><span class="flag">${data.security_notes.length} note${data.security_notes.length>1?'s':''}</span>`;
  }
  t.innerHTML = html;
  row.appendChild(t);
}

async function send(){
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  autoGrow();
  sendBtn.disabled = true;

  addRow('user', text);
  const typingRow = addTypingRow();

  try{
    const res = await fetch('/chat', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ message: text, thread_id: threadId })
    });

    typingRow.remove();

    if(res.status === 429){
      addRow('system', 'Rate limit reached. Wait a moment before sending another message.');
    } else if(res.status === 400){
      const err = await res.json().catch(() => ({}));
      addRow('system', err.detail || 'That message was blocked by the security filter.');
    } else if(!res.ok){
      addRow('system', 'Something went wrong processing that request. Please try again.');
    } else {
      const data = await res.json();
      const row = addRow('assistant', data.response);
      addTrace(row, data);
    }
  } catch(e){
    typingRow.remove();
    addRow('system', 'Could not reach the service. Check your connection and try again.');
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener('click', send);
</script>
</body>
</html>
